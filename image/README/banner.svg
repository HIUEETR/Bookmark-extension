<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420">

<defs>

<!-- 背景 -->
<linearGradient id="bg-grad"
 x1="0"
 y1="0"
 x2="1200"
 y2="420"
 gradientUnits="userSpaceOnUse">

 <stop offset="0%" stop-color="#020617"/>
 <stop offset="40%" stop-color="#0f172a"/>
 <stop offset="100%" stop-color="#1e1b4b"/>

</linearGradient>


<!-- 光带 -->
<linearGradient id="speed-grad">

 <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
 <stop offset="35%" stop-color="#6366f1" stop-opacity=".65"/>
 <stop offset="70%" stop-color="#818cf8" stop-opacity=".3"/>
 <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>

</linearGradient>



<!-- 核心光 -->
<radialGradient id="core-glow">

 <stop offset="0%" stop-color="#818cf8" stop-opacity=".55"/>
 <stop offset="45%" stop-color="#6366f1" stop-opacity=".25"/>
 <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>

</radialGradient>



<!-- Logo光 -->
<radialGradient id="logo-glow">

 <stop offset="0%" stop-color="#818cf8" stop-opacity=".5"/>
 <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>

</radialGradient>



<filter id="blur">
 <feGaussianBlur stdDeviation="55"/>
</filter>


<filter id="soft">
 <feGaussianBlur stdDeviation="12"/>
</filter>



<style>


/* 呼吸 */

.pulse{
 animation:pulse 6s ease-in-out infinite;
}


@keyframes pulse{

0%,100%{
 opacity:.18;
}

50%{
 opacity:.38;
}

}



/* 浮动 */

.float{

 animation:float 5s ease-in-out infinite;

}


@keyframes float{

0%,100%{
 transform:translateY(0);
}

50%{
 transform:translateY(-10px);
}

}




/* 光带 */

.speed{

animation:speed 12s linear infinite;

}


@keyframes speed{

from{
 transform:translateX(-500px);
}

to{
 transform:translateX(1300px);
}

}




/* 粒子 */

.drift{

animation:drift 8s ease-in-out infinite;

}


@keyframes drift{

0%,100%{
 transform:translate(0,0);
}

50%{
 transform:translate(12px,-15px);
}


}



</style>

</defs>




<!-- ================= 背景 ================= -->


<rect width="1200"
      height="420"
      rx="12"
      fill="url(#bg-grad)"/>



<!-- 能量核心 -->


<ellipse class="pulse"
 cx="950"
 cy="180"
 rx="350"
 ry="220"
 fill="url(#core-glow)"
 filter="url(#blur)"/>


<ellipse class="pulse"
 cx="230"
 cy="320"
 rx="220"
 ry="120"
 fill="#4f46e5"
 opacity=".15"
 filter="url(#blur)"/>




<!-- 速度光带 -->


<g class="speed"
 opacity=".35">


<path d="
M-100 480
L500 -20
L580 -20
L-20 480Z"
fill="url(#speed-grad)"
filter="url(#soft)"/>



<path d="
M220 480
L900 -20
L980 -20
L280 480Z"
fill="url(#speed-grad)"
opacity=".7"
filter="url(#soft)"/>


</g>




<!-- 细光轨 -->

<g stroke-linecap="round">


<line
x1="-50"
y1="350"
x2="400"
y2="-50"
stroke="#6366f1"
stroke-width="2"
opacity=".35"/>


<line
x1="700"
y1="450"
x2="1250"
y2="-50"
stroke="#818cf8"
stroke-width="2"
opacity=".25"/>


</g>





<!-- ================= 漂浮书签 ================= -->


<!-- 右上 -->

<g transform="translate(1020 60) rotate(-15)"
opacity=".25">


<g class="float">


<path d="
M0 0
V90
L25 72
L50 90
V0Z"
fill="none"
stroke="#6366f1"
stroke-width="2.5"/>


</g>


</g>





<!-- 左下 -->


<g transform="translate(80 280) rotate(25)"
opacity=".2">


<g class="float">


<path d="
M0 0
V65
L18 50
L36 65
V0Z"
fill="none"
stroke="#818cf8"
stroke-width="2"/>


</g>


</g>






<!-- ================= 粒子 ================= -->


<g class="drift"
fill="#a5b4fc">


<circle cx="320" cy="120" r="3"/>
<circle cx="345" cy="95" r="2"/>
<circle cx="620" cy="80" r="2"/>
<circle cx="880" cy="320" r="3"/>


</g>






<!-- ================= LOGO ================= -->


<g transform="translate(130 105)">



<!-- 外发光 -->

<circle
cx="86"
cy="86"
r="95"
fill="url(#logo-glow)"
filter="url(#soft)"
class="pulse"/>



<!-- 动画层 -->

<g class="float">


<!-- 阴影 -->

<rect
x="8"
y="12"
width="156"
height="156"
rx="30"
fill="#000"
opacity=".35"/>




<!-- 背板 -->

<rect
width="172"
height="172"
rx="34"
fill="#0f172a"
stroke="#1e293b"
stroke-width="1.5"/>




<!-- bookmark -->


<rect
x="40"
y="26"
width="92"
height="120"
rx="14"
fill="#6366f1"/>



<path d="
M59 62
H113

M59 86
H113

M59 110
H97"
stroke="white"
stroke-width="12"
stroke-linecap="round"/>



</g>


</g>






<!-- ================= 标题 ================= -->


<g transform="translate(350 155)">



<text

font-family="system-ui,Segoe UI,Arial"

font-size="76"

font-weight="900"

font-style="italic"

letter-spacing="-2"

fill="#f8fafc">

Bookmark-Extension

</text>




<rect

x="0"
y="35"

width="210"

height="6"

rx="3"

fill="#6366f1"/>




<text

y="95"

font-family="system-ui,Segoe UI,Arial"

font-size="26"

fill="#94a3b8">

Modern bookmarking, beautifully organized.

</text>




<!-- 标签 -->


<g transform="translate(0 130)">



<rect
width="80"
height="28"
rx="7"
fill="#1e293b"
stroke="#334155"/>


<text

x="40"
y="19"

text-anchor="middle"

font-family="system-ui"

font-size="12"

fill="#818cf8">

Extension

</text>



<rect
x="95"
width="120"
height="28"
rx="7"
fill="#1e293b"
stroke="#334155"/>


<text

x="155"
y="19"

text-anchor="middle"

font-family="system-ui"

font-size="12"

fill="#818cf8">

Bookmark

</text>



</g>



</g>






<!-- 底部能量线 -->


<polygon points="
0,415
1200,405
1200,420
0,420"

fill="#6366f1"
opacity=".7"/>


<polygon points="
0,417
360,412
360,420
0,420"

fill="#818cf8"/>



</svg>