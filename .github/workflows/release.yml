name: Release Browser Extension

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Create ZIP package
        run: |
          cd dist
          zip -r "../MyBookmark-${{ github.ref_name }}.zip" .
          cd ..
          ls -lh MyBookmark-*.zip

      - name: Generate changelog using git describe
        id: changelog
        run: |
          CURRENT_TAG="${{ github.ref_name }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "v0.0.0")

          echo "Current tag: $CURRENT_TAG"
          echo "Previous tag: $PREV_TAG"

          echo "changelog<<EOF" >> $GITHUB_OUTPUT

          if [ "$PREV_TAG" = "v0.0.0" ]; then
            echo "### 首次发布" >> $GITHUB_OUTPUT
            echo "无历史差异。" >> $GITHUB_OUTPUT
          else
            echo "### 与上个版本的差异" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "#### Commits" >> $GITHUB_OUTPUT
            git log --pretty=format:"- %s (%h)" ${PREV_TAG}..${CURRENT_TAG} >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "#### Changed files" >> $GITHUB_OUTPUT
            git diff --name-status ${PREV_TAG}..${CURRENT_TAG} >> $GITHUB_OUTPUT
          fi

          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: My Bookmark ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            MyBookmark-${{ github.ref_name }}.zip
          body: |
            ## My Bookmark ${{ github.ref_name }}

            ### 下载
            - 扩展安装包：`MyBookmark-${{ github.ref_name }}.zip`

            ### 安装方法
            1. 下载 ZIP 并解压
            2. 打开 chrome://extensions 或 edge://extensions
            3. 启用「开发者模式」
            4. 选择「加载已解压的扩展」并选择解压后的目录

            ---

            ${{ steps.changelog.outputs.changelog }}

            ---

            > 本 Release 由 GitHub Actions 自动构建并发布。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
